<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Hephaisto">
  <!--
    The mark is the console's own glyph for `escalated` - the ^ it prints the moment the agent
    decides a human is needed - drawn as a solid wedge so it reads equally as a spark. That is
    the only forge the identity gets: no anvil, no hammer.

    Since v0.15.0 it sits in the True Relevance signature device: a glyph in ink on a SOLID
    Clarity Blue circle, the one place the brand book allows a brand colour to be solid. A circle
    rather than the old rounded tile, because the brand draws in circles and pills. It keeps an
    edge against a dark browser chrome and a light one alike, which is what the tile was for.
    Sized against 16px, the only size a favicon really has to survive.

    (Token names are spelled out in prose here on purpose: a double hyphen is illegal inside an
    XML comment, so writing the CSS custom property names literally made this file invalid and
    it failed as a silently broken image.)
  -->
  <circle cx="16" cy="16" r="16" fill="#4ec2df"/>
  <path d="M16 6.6 L25.4 24.6 L20.8 24.6 L16 15.6 L11.2 24.6 L6.6 24.6 Z" fill="#2f2f2f"/>
</svg>
