# Everything on at once. Exists so that a template only exercised by an unusual combination
# still gets rendered in CI.
image:
  repository: ghcr.io/truerelevance/hephaisto
  tag: "0.0.1"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-pull

serviceAccount:
  name: hephaisto
  annotations:
    example.com/owner: sre

cluster:
  name: ci-full

investigation:
  inScopeNamespaces: [app]

llm:
  pricing:
    - model: my-gateway-model
      inputPerMillionUsd: 0.30
      outputPerMillionUsd: 2.50

observabilityNamespace: hephaisto-obs

prometheusOperator:
  selectorLabels:
    release: kube-prometheus-stack
    example.com/extra: "yes"

policy:
  actionableNamespaces:
    - hephaisto-chaos
    - some-app

mode: DryRun

incidents:
  healedAfter: "00:15:00"
  sweep:
    enabled: true
    expireAfter: "7.00:00:00"
    approvalTimeout: "12:00:00"

secrets:
  postgres: hephaisto-postgres
  llm: hephaisto-llm
  grafanaMcp: grafana-mcp-caller-token
  mcp: hephaisto-mcp
  github: hephaisto-github

postgres:
  host: postgres
  port: 5432
  embedded:
    enabled: true
    image: pgvector/pgvector:pg17
    storage: 20Gi
    storageClassName: standard

otel:
  endpoint: http://otel-collector.hephaisto-obs:4318
  protocol: http/protobuf
  environment: ci

grafanaMcp:
  podLogSelector: '{namespace="<namespace>", pod="<pod>"}'
  url: http://grafana-mcp.hephaisto-obs:8000/mcp

alerts:
  kubernetes: true
  slo: true
  watchdog: true
  observabilitySelfcheck: true

dashboard:
  enabled: true
  sidecarLabel: grafana_dashboard
  folder: Hephaisto

networkPolicy:
  enabled: true
  extraIngressCIDRs:
    - 10.42.0.0/16

rbac:
  create: true
  nodeRole: true

podAnnotations:
  example.com/note: "rendered by CI"

nodeSelector:
  kubernetes.io/os: linux

tolerations:
  - key: example.com/dedicated
    operator: Exists
    effect: NoSchedule

# The seam for configuration the chart does not expose as a value. Exercised here so
# kubeconform validates the rendered env entries, and so the reserved-name guard in
# _helpers.tpl is rendered against a values file that actually uses it.
extraEnv:
  - name: Llm__Budget__MaxCostUsdPerHour
    value: "1.00"
  - name: Llm__Investigation__MaxSteps
    value: "8"
  - name: Llm__Model
    valueFrom:
      configMapKeyRef:
        name: hephaisto-model
        key: model
extraEnvFrom:
  - configMapRef:
      name: hephaisto-extra-config

# OIDC on, so codeFix.mode below can be pr: approving a repository write needs an
# authenticated human, and the chart refuses pr without it.
auth:
  enabled: true
  authority: https://keycloak.example.com/realms/hephaisto
  approverRole: hephaisto-approver

notifications:
  baseUrl: https://hephaisto.example.com
  webhook:
    url: https://hooks.example.com/hephaisto
  teamsBot:
    enabled: true
    tenantId: f4447a03-0000-0000-0000-000000000000
    appId: 58b00500-0000-0000-0000-000000000000
    channelId: "19:abc@thread.tacv2"
    teamId: 11111111-0000-0000-0000-000000000000
    recipients: [oncall@example.com, dev@example.com]
    board:
      maxIncidents: 15
    # The one inbound route Microsoft calls, so the render test covers its port, Service
    # entry and NetworkPolicy rule.
    actions:
      enabled: true
      port: 8082
      # Entra object ids: who may close from a card.
      approvers:
        - 5f0c0000-0000-0000-0000-000000000001
        - 5f0c0000-0000-0000-0000-000000000002
      approvals:
        enabled: true
  routes:
    - channel: webhook
      events: [IncidentEscalated, CodeFixPlanReady, CodeFixPrOpened, CodeFixFailed, PlannerReviewFinished]
    - channel: teamsBot
      events: [IncidentEscalated, ApprovalRequired, VerificationFailed, CodeFixPlanReady]
      minSeverity: Warning

# Every code-fix template at once: its own namespace object, the Role, the unbound
# ServiceAccount, both NetworkPolicies, the proxy with an extra allowlist entry, and the NuGet
# cache. mode pr, because that is the widest thing the chart can be asked to render.
codeFix:
  enabled: true
  mode: pr
  namespace: hephaisto-coder
  createNamespace: true
  image:
    repository: ghcr.io/truerelevance/hephaisto-coder
    tag: "0.0.1"
    pullPolicy: IfNotPresent
  contextRepository:
    url: https://github.com/example/dev-context
    ref: main
  repositories:
    - workload: shop/Deployment/shop-api
      url: https://github.com/example/shop
      defaultBranch: main
      path: ""
    - workload: shop/StatefulSet/shop-worker
      url: https://github.com/example/shop
      defaultBranch: main
      path: src/Worker
  allowedRepositoryHosts: [github.com]
  eligibleCategories: [application, config]
  confidenceFloor: 0.75
  budgets:
    perPlanUsd: 4
    perImplementUsd: 12.5
    perDayUsd: 40
    attemptsPerRepositoryPerDay: 2
    concurrentJobs: 1
  deadlines:
    plan: "00:25:00"
    implement: "00:50:00"
    approvalTimeout: "2.00:00:00"
    jobTtl: "02:00:00"
    pollInterval: "00:00:20"
  workspaceSize: 10Gi
  resources:
    cpuRequest: 500m
    memoryRequest: 2Gi
    cpuLimit: "4"
    memoryLimit: 6Gi
  requireGreenBuild: true
  allowUnauthenticatedApproval: false
  sdk: real
  gh: ""
  egressProxy:
    enabled: true
    extraAllowlist:
      - nuget.example.com
  nugetCache:
    enabled: true
    size: 20Gi
    storageClass: standard
  networkPolicy:
    enabled: true

# The MCP endpoint (#157), with one token of each kind and a gateway's namespace admitted.
mcp:
  enabled: true
  port: 8083
  tokens:
    - name: gateway
      kind: shared
      role: reader
    - name: oncall
      kind: person
      subject: oncall
      role: approver
      mayWrite: false
  networkPolicy:
    fromNamespaces: [gateway]

# GitHub issues as work (v0.14.0): two repositories, an approver whose number has eight digits,
# and - because the proxy above is on - the agent's GitHub calls through it.
github:
  enabled: true
  apiBaseUrl: https://api.github.com
  botLogin: hephaisto-bot
  pollInterval: "00:01:00"
  issues:
    repositories:
      - example/shop
      - example/dev-context
  approvers:
    - 1001
    - 12345678
  useEgressProxy: true
