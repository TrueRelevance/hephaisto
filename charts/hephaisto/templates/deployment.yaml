{{- include "hephaisto.validateActionableNamespaces" . -}}
{{- include "hephaisto.validateExtraEnv" . -}}
{{- include "hephaisto.validateCodeFix" . -}}
{{- include "hephaisto.validateGitHub" . -}}
{{/*
=========================================================================================
WHY replicas: 1 AND strategy: Recreate - and why the chart exposes no replicaCount
=========================================================================================
Before the agent executes any action it must, atomically: check the LLM budget, check the
cooldown for this target, check the kill switch, and INSERT the action record claiming the
right to perform it. All four are ONE Postgres transaction. If they are not, the gap between
checking and acting is a TOCTOU window, and the code path that window sits on ends in
`kubectl delete pod`.

With two replicas that is a genuine distributed race: both read the cooldown as clear, both
act, both write a correct-looking row, and the cooldown that exists precisely to stop
repeated destructive action against one target did not hold. The same shape breaks the budget
and, worst, the kill switch: a human flips it, one replica observes it, the other has already
read the old value and proceeds. A kill switch a second replica can race is not a kill switch.

`strategy: Recreate` is the same argument at rollout time - RollingUpdate deliberately runs
old and new pods simultaneously, which is the two-replica scenario arriving through the back
door on every deploy. The downtime is a deliberate limitation, and what covers it (#144):
the webhook answers only after it has written, so a delivery that arrives while the pod is
replaced is refused and Alertmanager RETRIES it - minutes, not the hours of repeat_interval
this comment used to price it at (#136). A restart that does not come back is reported by
HephaistoAbsent in files/alerts/agent-presence.yaml, on a route that does not pass through
the agent (#137).
=========================================================================================
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hephaisto.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hephaisto.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "hephaisto.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hephaisto.labels" . | nindent 8 }}
      annotations:
        # Roll the pod when the switch ConfigMap's DEFAULTS change. Note this does not fight
        # an emergency edit: the checksum is of the rendered template, not of the live object.
        checksum/switches: {{ include (print $.Template.BasePath "/configmap-switches.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "hephaisto.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Long enough to finish an in-flight action and commit its transaction. Being killed
      # mid-action is how the action log and reality diverge - the row says "restarted", the
      # pod says otherwise - and a divergent action log poisons every later decision that
      # reads it as history.
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 64198
        runAsGroup: 64198
        fsGroup: 64198
      {{- if .Values.postgres.embedded.enabled }}
      # Without this, the very first start of a fresh install is GUARANTEED to fail once.
      # Program.cs awaits MigrateHephaistoDatabaseAsync before RunAsync, so a database that is
      # not yet accepting connections is a fatal start rather than a slow one - and the
      # startupProbe below cannot help, because the process exits before it ever listens. The
      # visible result was a healthy install that always reported RESTARTS: 1, which looks
      # exactly like something being wrong.
      #
      # Rendered only for the embedded database. With an external postgres.host the chart has
      # no image carrying a Postgres client and no say in that database's lifecycle, so the
      # existing fail-fast-and-restart behaviour stands there - see NOTES.txt.
      initContainers:
        - name: wait-for-postgres
          # The database's own image: already pulled for the StatefulSet, so no new layer to
          # fetch, and the only image in this chart carrying pg_isready. The agent image is
          # aspnet:10.0-based and ships neither pg_isready nor nc.
          image: {{ .Values.postgres.embedded.image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              # Bounded deliberately. A database that is genuinely broken has to surface as a
              # failed pod with a reason, not as an init container that waits forever and
              # tells nobody anything.
              for _ in $(seq 1 60); do
                if pg_isready -h "$PGHOST" -p "$PGPORT" -U "$POSTGRES_USER" -d "$POSTGRES_DB" -q; then
                  echo "postgres is accepting connections"
                  exit 0
                fi
                sleep 2
              done
              echo "postgres did not accept connections within 120s" >&2
              exit 1
          env:
            - name: PGHOST
              value: {{ include "hephaisto.fullname" . }}-postgres.{{ .Release.Namespace }}
            - name: PGPORT
              value: {{ .Values.postgres.port | quote }}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ required "secrets.postgres is required." .Values.secrets.postgres }}
                  key: POSTGRES_USER
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ required "secrets.postgres is required." .Values.secrets.postgres }}
                  key: POSTGRES_DB
          # Same stance as the app container. A pg_isready loop needs no privileges and writes
          # nothing, so there is no reason for it to be the weakest thing in the pod.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      {{- end }}
      containers:
        - name: hephaisto
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            {{- if .Values.webhookPort }}
            # The Alertmanager receiver, outside OIDC, on its own port so a NetworkPolicy can
            # protect it without also deciding who may read the console. See values.yaml.
            - name: webhook
              containerPort: {{ .Values.webhookPort }}
              protocol: TCP
            {{- end }}
            {{- with include "hephaisto.teamsActionsPort" . }}
            # The one route Microsoft calls when an alert's button acts. Nothing else answers here.
            - name: teams-actions
              containerPort: {{ . }}
              protocol: TCP
            {{- end }}
            {{- with include "hephaisto.mcpPort" . }}
            # The MCP endpoint (#157): /mcp and nothing else.
            - name: mcp
              containerPort: {{ . }}
              protocol: TCP
            {{- end }}
            {{- with include "hephaisto.investigatorPort" . }}
            # The investigator port (v0.12.0 F5): /investigate and nothing else.
            - name: investigator
              containerPort: {{ . }}
              protocol: TCP
            {{- end }}
          env:
            # ---------------------------------------------------------------------------
            # Mode - the env arm of the kill switch
            # ---------------------------------------------------------------------------
            - name: HEPHAISTO_MODE
              value: {{ .Values.mode | quote }}

            # ---------------------------------------------------------------------------
            # When an incident ends by itself (#158)
            # ---------------------------------------------------------------------------
            - name: Kubernetes__HealedAfter
              value: {{ .Values.incidents.healedAfter | quote }}
            - name: IncidentSweep__Enabled
              value: {{ .Values.incidents.sweep.enabled | quote }}
            - name: IncidentSweep__ExpireAfter
              value: {{ .Values.incidents.sweep.expireAfter | quote }}
            - name: IncidentSweep__ApprovalTimeout
              value: {{ .Values.incidents.sweep.approvalTimeout | quote }}

            # ---------------------------------------------------------------------------
            # The cluster - one name for the fingerprint, the watcher and the model (#139)
            # ---------------------------------------------------------------------------
            - name: Cluster__Name
              value: {{ required "cluster.name is required: the value of the `cluster` label on this cluster's metrics and logs. It is in every signal fingerprint and every query the model writes, and no default can be right for a cluster the chart has never seen." .Values.cluster.name | quote }}
            {{- range $i, $ns := .Values.investigation.inScopeNamespaces }}
            - name: Investigation__Environment__InScopeNamespaces__{{ $i }}
              value: {{ $ns | quote }}
            {{- end }}

            {{- with .Values.sourceUrl }}
            # AGPL section 13: the source of the build these users are talking to.
            - name: Hephaisto__SourceUrl
              value: {{ . | quote }}
            {{- end }}

            # ---------------------------------------------------------------------------
            # Policy
            # ---------------------------------------------------------------------------
            # Same list that drives the RBAC write Role, so the grant and the app's own
            # policy cannot disagree. .NET binds Policy__AllowedNamespaces__0.. to a set.
            {{- range $i, $ns := .Values.policy.actionableNamespaces }}
            - name: Policy__AllowedNamespaces__{{ $i }}
              value: {{ $ns | quote }}
            {{- end }}

            # The autonomy gate. Read only when the resolved mode is Auto, so this list and
            # `mode` are two independent things that both have to be true - which is what
            # makes "promote one action type at a time" a real control rather than a habit.
            {{- range $i, $type := .Values.policy.autoEnabledActionTypes }}
            - name: Policy__AutoEnabledActionTypes__{{ $i }}
              value: {{ $type | quote }}
            {{- end }}

            # The rollback gate's two windows, and the cluster-wide escalation ceiling. Emitted
            # unconditionally rather than `if`-guarded: a values file that sets one of these to
            # something the operator intended and a template that quietly drops it is the exact
            # failure mode backlog #22 is about - a setting with a reader in src/ and no way to
            # reach it.
            - name: Policy__RollbackFreshRevisionWindow
              value: {{ .Values.policy.rollbackFreshRevisionWindow | quote }}
            - name: Policy__RollbackPreviousHealthyMinimum
              value: {{ .Values.policy.rollbackPreviousHealthyMinimum | quote }}
            - name: Policy__ClusterUnhealthyCeiling
              value: {{ .Values.policy.clusterUnhealthyCeiling | quote }}

            # ---------------------------------------------------------------------------
            # Database
            # ---------------------------------------------------------------------------
            # The agent does not read this Secret through the Kubernetes API - it has no `get`
            # on secrets anywhere. The kubelet injects it; the agent cannot enumerate it.
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ required "secrets.postgres is required: the chart never creates a Secret, it only references one." .Values.secrets.postgres }}
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "secrets.postgres is required." .Values.secrets.postgres }}
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ required "secrets.postgres is required." .Values.secrets.postgres }}
                  key: POSTGRES_DB
            # The password for the SERVING role. Optional so that upgrading a release whose
            # Secret predates this key does not wedge the pod in CreateContainerConfigError -
            # the agent falls back to serving as the owner and logs a warning saying that
            # audit immutability is not enforced. Run scripts/bootstrap-secrets.sh to add it.
            - name: POSTGRES_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "secrets.postgres is required." .Values.secrets.postgres }}
                  key: POSTGRES_APP_PASSWORD
                  optional: true
            - name: ConnectionStrings__hephaisto
              value: "Host={{ if .Values.postgres.embedded.enabled }}{{ include "hephaisto.fullname" . }}-postgres{{ else }}{{ .Values.postgres.host }}{{ end }}.{{ .Release.Namespace }};Port={{ .Values.postgres.port }};Database=$(POSTGRES_DB);Username=$(POSTGRES_USER);Password=$(POSTGRES_PASSWORD);Include Error Detail=true"

            # The connection the agent SERVES on: the same database, as a role that holds
            # INSERT but not UPDATE or DELETE on audit_events. ConnectionStrings__hephaisto
            # above stays the owner and is what migrates and grants.
            #
            # When POSTGRES_APP_PASSWORD is absent the kubelet leaves "$(POSTGRES_APP_PASSWORD)"
            # unexpanded rather than empty, so the agent checks for that literal and treats it
            # as unset - see EnsureAuditImmutabilityAsync.
            - name: ConnectionStrings__hephaisto_app
              value: "Host={{ if .Values.postgres.embedded.enabled }}{{ include "hephaisto.fullname" . }}-postgres{{ else }}{{ .Values.postgres.host }}{{ end }}.{{ .Release.Namespace }};Port={{ .Values.postgres.port }};Database=$(POSTGRES_DB);Username={{ .Values.postgres.appUser }};Password=$(POSTGRES_APP_PASSWORD);Include Error Detail=true"

            # ---------------------------------------------------------------------------
            # Telemetry
            # ---------------------------------------------------------------------------
            {{- if .Values.otel.endpoint }}
            # HTTP/protobuf rather than gRPC: when this stops working, `curl -v` from inside
            # the pod is a complete diagnosis. For the one service whose telemetry must be
            # trustworthy, debuggability beats efficiency.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otel.endpoint | quote }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: {{ .Values.otel.protocol | quote }}
            - name: OTEL_LOGS_EXPORTER
              value: otlp
            - name: OTEL_METRICS_EXPORTER
              value: otlp
            - name: OTEL_TRACES_EXPORTER
              value: otlp
            # Exemplars are what link the agent's own latency histograms to its traces.
            - name: OTEL_METRICS_EXEMPLAR_FILTER
              value: trace_based
            {{- end }}
            - name: OTEL_SERVICE_NAME
              value: {{ include "hephaisto.fullname" . }}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace={{ .Release.Namespace }}{{ with .Values.otel.environment }},deployment.environment={{ . }}{{ end }}"

            # ---------------------------------------------------------------------------
            # grafana-mcp - the agent's PromQL/LogQL/trace tools
            # ---------------------------------------------------------------------------
            # Unlike the inbound webhook, this call IS bearer-authenticated: the agent is our
            # own code and can set a header.
            #
            # The names are `Grafana__<Property>`, matching GrafanaOptions.SectionName. They
            # were once HEPHAISTO_GRAFANA_MCP_URL/_TOKEN, which nothing read - the binder
            # wanted these names, McpUrl stayed null, and the agent ran for weeks with
            # Kubernetes tools only and said nothing, because an empty tool list looks exactly
            # like a legitimately unreachable grafana-mcp.
            {{- if .Values.grafanaMcp.url }}
            - name: Grafana__McpUrl
              value: {{ .Values.grafanaMcp.url | quote }}
            - name: Grafana__ServiceAccountToken
              valueFrom:
                secretKeyRef:
                  name: {{ required "secrets.grafanaMcp is required when grafanaMcp.url is set. Only Grafana can mint this token, so it cannot exist before install - create it first." .Values.secrets.grafanaMcp }}
                  key: token
            {{- end }}

            # ---------------------------------------------------------------------------
            # Grafana annotations - the incident timeline, drawn on the dashboards
            # ---------------------------------------------------------------------------
            # Deliberately a different service and a different credential from grafana-mcp
            # above. This is the one Grafana token in the system that may write, so it is
            # named separately rather than quietly reusing the read-shaped one.
            {{- if .Values.grafana.url }}
            - name: Grafana__Url
              value: {{ .Values.grafana.url | quote }}
            - name: Grafana__AnnotationToken
              valueFrom:
                secretKeyRef:
                  name: {{ required "secrets.grafanaAnnotation is required when grafana.url is set. Only Grafana can mint this token, so it cannot exist before install." .Values.secrets.grafanaAnnotation }}
                  key: token
            {{- end }}

            {{- range $name, $uid := .Values.grafanaMcp.datasourceUids }}
            # A fact the agent cannot look up is what the environment card is for. Each of
            # these saves a list_datasources call on every investigation that touches Grafana.
            - name: Investigation__Environment__DatasourceUids__{{ $name }}
              value: {{ $uid | quote }}
            {{- end }}

            {{- with .Values.grafanaMcp.podLogSelector }}
            # Loki first for pod logs (#160): the selector is the install's, so it is told.
            - name: Investigation__Environment__PodLogSelector
              value: {{ . | quote }}
            {{- end }}

            {{- if .Values.alertmanager.url }}
            # Write-only, and the only thing written is a silence. Alerts arrive by webhook.
            - name: Alertmanager__Url
              value: {{ .Values.alertmanager.url | quote }}
            - name: Alertmanager__MaxDuration
              value: {{ .Values.alertmanager.maxDuration | quote }}
            {{- end }}

            # ---------------------------------------------------------------------------
            # Outbound notifications - the only thing here that leaves the cluster on the
            # agent's own initiative
            # ---------------------------------------------------------------------------
            {{- with .Values.notifications }}
            {{- if .baseUrl }}
            - name: Notifications__BaseUrl
              value: {{ .baseUrl | quote }}
            {{- end }}
            {{- if .grafanaUrl }}
            - name: Notifications__GrafanaUrl
              value: {{ .grafanaUrl | quote }}
            {{- end }}
            {{- /* Only with routes: a stock install renders no notification setting at all. */}}
            {{- if and .routes .maxPerChannelPerHour }}
            - name: Notifications__MaxPerChannelPerHour
              value: {{ .maxPerChannelPerHour | quote }}
            {{- end }}
            {{- if .webhook.url }}
            - name: Notifications__Webhook__Url
              value: {{ .webhook.url | quote }}
            {{- if .webhook.signed }}
            - name: Notifications__Webhook__SigningSecret
              valueFrom:
                secretKeyRef:
                  name: {{ required "secrets.notificationWebhook is required when notifications.webhook.signed is true. The chart never creates a Secret, it only references one." $.Values.secrets.notificationWebhook }}
                  key: signingSecret
            {{- end }}
            {{- end }}
            {{- if .teams.enabled }}
            # A secretKeyRef and never a value: a Workflows trigger URL carries its bearer
            # token in the query string, so passing it as a Helm value would put a live
            # credential in `helm get values`, in the release Secret, and in whatever git repo
            # holds your Argo Application - forever.
            - name: Notifications__Teams__WorkflowUrl
              valueFrom:
                secretKeyRef:
                  name: {{ required "secrets.notificationTeams is required when notifications.teams.enabled is true. The URL is the credential, so it cannot be a chart value." $.Values.secrets.notificationTeams }}
                  key: url
            {{- end }}
            {{- if .teamsBot.enabled }}
            # The bot. Three ids that are not secrets, and one secretKeyRef that is: the client
            # secret never becomes a value, for the reason the Workflows URL above does not.
            - name: Notifications__TeamsBot__TenantId
              value: {{ required "notifications.teamsBot.tenantId is required when notifications.teamsBot.enabled is true" .teamsBot.tenantId | quote }}
            - name: Notifications__TeamsBot__AppId
              value: {{ required "notifications.teamsBot.appId is required when notifications.teamsBot.enabled is true" .teamsBot.appId | quote }}
            - name: Notifications__TeamsBot__ChannelId
              value: {{ required "notifications.teamsBot.channelId is required when notifications.teamsBot.enabled is true. It is the channel that holds the board." .teamsBot.channelId | quote }}
            - name: Notifications__TeamsBot__ClientSecret
              valueFrom:
                secretKeyRef:
                  name: {{ required "secrets.notificationTeamsBot is required when notifications.teamsBot.enabled is true. The chart never creates a Secret, it only references one." $.Values.secrets.notificationTeamsBot }}
                  key: clientSecret
            {{- if .teamsBot.teamId }}
            - name: Notifications__TeamsBot__TeamId
              value: {{ .teamsBot.teamId | quote }}
            {{- end }}
            - name: Notifications__TeamsBot__BoardMaxIncidents
              value: {{ .teamsBot.board.maxIncidents | quote }}
            {{- with include "hephaisto.teamsActionsPort" $ }}
            - name: Notifications__TeamsBot__Actions__Enabled
              value: "true"
            - name: Notifications__TeamsBot__Actions__Port
              value: {{ . | quote }}
            {{- /* The approver role, by Entra object id. Only beside the route it belongs to:
                   with the buttons off there is nothing for an approver to press. */}}
            {{- range $a, $approver := $.Values.notifications.teamsBot.actions.approvers }}
            - name: Notifications__TeamsBot__Actions__Approvers__{{ $a }}
              value: {{ $approver | quote }}
            {{- end }}
            {{- if include "hephaisto.teamsApprovals" $ }}
            # Approve and Deny on a card. Its own switch: the one click here that can end in a
            # change to the cluster.
            - name: Notifications__TeamsBot__Actions__Approvals__Enabled
              value: "true"
            {{- end }}
            {{- end }}
            {{- range $r, $recipient := .teamsBot.recipients }}
            - name: Notifications__TeamsBot__Recipients__{{ $r }}
              value: {{ $recipient | quote }}
            {{- end }}
            {{- end }}
            {{- range $i, $route := .routes }}
            - name: Notifications__Routes__{{ $i }}__Channel
              value: {{ required "every notifications.routes entry needs a channel" $route.channel | quote }}
            {{- if $route.minSeverity }}
            - name: Notifications__Routes__{{ $i }}__MinSeverity
              value: {{ $route.minSeverity | quote }}
            {{- end }}
            {{- range $j, $event := $route.events }}
            - name: Notifications__Routes__{{ $i }}__Events__{{ $j }}
              value: {{ $event | quote }}
            {{- end }}
            {{- range $k, $ns := $route.namespaces }}
            - name: Notifications__Routes__{{ $i }}__Namespaces__{{ $k }}
              value: {{ $ns | quote }}
            {{- end }}
            {{- if $route.name }}
            - name: Notifications__Routes__{{ $i }}__Name
              value: {{ $route.name | quote }}
            {{- end }}
            {{- range $m, $matcher := $route.matchers }}
            - name: Notifications__Routes__{{ $i }}__Matchers__{{ $m }}__Label
              value: {{ required "every notifications.routes[].matchers entry needs a label" $matcher.label | quote }}
            {{- range $v, $value := $matcher.values }}
            - name: Notifications__Routes__{{ $i }}__Matchers__{{ $m }}__Values__{{ $v }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
            {{- range $c, $cluster := $route.clusters }}
            - name: Notifications__Routes__{{ $i }}__Clusters__{{ $c }}
              value: {{ $cluster | quote }}
            {{- end }}
            {{- range $k, $kind := $route.kinds }}
            - name: Notifications__Routes__{{ $i }}__Kinds__{{ $k }}
              value: {{ $kind | quote }}
            {{- end }}
            {{- range $r, $recipient := $route.recipients }}
            - name: Notifications__Routes__{{ $i }}__Recipients__{{ $r }}
              value: {{ $recipient | quote }}
            {{- end }}
            {{- if $route.fallback }}
            - name: Notifications__Routes__{{ $i }}__Fallback
              value: "true"
            {{- end }}
            {{- range $s, $step := $route.steps }}
            - name: Notifications__Routes__{{ $i }}__Steps__{{ $s }}__After
              value: {{ required "every notifications.routes[].steps entry needs after, as hh:mm:ss" $step.after | quote }}
            {{- if $step.minSeverity }}
            - name: Notifications__Routes__{{ $i }}__Steps__{{ $s }}__MinSeverity
              value: {{ $step.minSeverity | quote }}
            {{- end }}
            {{- if $step.channel }}
            - name: Notifications__Routes__{{ $i }}__Steps__{{ $s }}__Channel
              value: {{ $step.channel | quote }}
            {{- end }}
            {{- range $r, $recipient := $step.recipients }}
            - name: Notifications__Routes__{{ $i }}__Steps__{{ $s }}__Recipients__{{ $r }}
              value: {{ $recipient | quote }}
            {{- end }}
            {{- if $step.toAssignee }}
            - name: Notifications__Routes__{{ $i }}__Steps__{{ $s }}__ToAssignee
              value: "true"
            {{- end }}
            {{- end }}
            {{- end }}
            {{- end }}

            # ---------------------------------------------------------------------------
            # LLM
            # ---------------------------------------------------------------------------
            # Two keys, both optional, because which one is needed depends on Llm:Provider
            # and an install legitimately carries only one. GEMINI_API_KEY serves the gemini
            # provider, and the embedding generator while Llm:EmbeddingProvider is gemini -
            # its default; LLM_API_KEY serves the openai-compatible provider - DeepSeek,
            # OpenRouter, a local server.
            #
            # An install that self-hosts embeddings needs NEITHER for them: set
            # Llm__EmbeddingProvider=openai and Llm__EmbeddingEndpoint at a local server
            # through extraEnv, and the vector arm of search works with no external account.
            #
            # `optional: true` moves the missing-key failure from the kubelet to the app,
            # which is an improvement rather than a relaxation: CreateContainerConfigError on
            # a pod nobody is watching says less than the agent refusing to start with the
            # name of the setting it wants. The Secret itself is still `required` - a dangling
            # reference is a different mistake and stays fatal at template time.
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "secrets.llm is required: the chart never creates a Secret, it only references one." .Values.secrets.llm }}
                  key: GEMINI_API_KEY
                  optional: true
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "secrets.llm is required: the chart never creates a Secret, it only references one." .Values.secrets.llm }}
                  key: LLM_API_KEY
                  optional: true

            # Prices, as a list because a model id is not a valid env var NAME (#140). The agent
            # refuses to start when a cost cap is set and the model it bills has no price.
            {{- range $i, $p := .Values.llm.pricing }}
            - name: Llm__Prices__{{ $i }}__Model
              value: {{ required "every llm.pricing entry needs a model" $p.model | quote }}
            - name: Llm__Prices__{{ $i }}__InputPerMillionUsd
              value: {{ $p.inputPerMillionUsd | toString | quote }}
            - name: Llm__Prices__{{ $i }}__OutputPerMillionUsd
              value: {{ $p.outputPerMillionUsd | toString | quote }}
            {{- end }}

            # ---------------------------------------------------------------------------
            # Self namespaces - the agent's own signals are escalated, never acted on
            # ---------------------------------------------------------------------------
            # The release namespace, the observability stack, and the coder namespace when code
            # fixes are on. An alert about Hephaisto itself is intended; Hephaisto restarting
            # itself mid-action because of one is a feedback loop. Until v0.9.0 the chart set
            # none of these and an install outside `hephaisto`/`hephaisto-obs` relied on the
            # agent's built-in defaults naming the right namespaces by coincidence - backlog #115.
            {{- range $i, $ns := include "hephaisto.selfNamespaces" . | splitList " " }}
            - name: Ingest__SelfNamespaces__{{ $i }}
              value: {{ $ns | quote }}
            {{- end }}

            {{- if .Values.codeFix.enabled }}
            {{- with .Values.codeFix }}

            # ---------------------------------------------------------------------------
            # Code fixes - a second stage, on its own axis. See templates/rbac-codefix.yaml.
            # ---------------------------------------------------------------------------
            # The env arm of the code-fix mode. The switch ConfigMap's codeFixMode is the other,
            # the most restrictive wins, and the agent's kill switch overrides both.
            - name: CodeFix__Mode
              value: {{ .mode | toString | quote }}
            # The ONE namespace the Role in rbac-codefix.yaml grants `create jobs` in. Rendered
            # from the same helper as that Role, so the two cannot name different places.
            - name: CodeFix__Namespace
              value: {{ include "hephaisto.codeFixNamespace" $ | quote }}
            - name: CodeFix__Image
              value: {{ include "hephaisto.codeFixImage" $ | quote }}
            - name: CodeFix__ImagePullPolicy
              value: {{ .image.pullPolicy | default "IfNotPresent" | quote }}
            - name: CodeFix__ServiceAccountName
              value: {{ include "hephaisto.codeFixServiceAccountName" $ | quote }}
            # A NAME. The Secret is in the coder namespace and reaches coder pods by secretKeyRef;
            # Hephaisto has no RBAC that could read it, and does not try.
            - name: CodeFix__SecretName
              value: {{ $.Values.secrets.codeFix | quote }}
            - name: CodeFix__ContextRepositoryUrl
              value: {{ .contextRepository.url | quote }}
            - name: CodeFix__ContextRepositoryRef
              value: {{ .contextRepository.ref | quote }}
            # The authorization list, evaluated in-process by the eligibility predicate.
            {{- range $i, $r := .repositories }}
            - name: CodeFix__Repositories__{{ $i }}__Workload
              value: {{ $r.workload | quote }}
            - name: CodeFix__Repositories__{{ $i }}__Url
              value: {{ $r.url | quote }}
            - name: CodeFix__Repositories__{{ $i }}__DefaultBranch
              value: {{ $r.defaultBranch | default "main" | quote }}
            - name: CodeFix__Repositories__{{ $i }}__Path
              value: {{ $r.path | default "" | quote }}
            {{- end }}
            {{- range $i, $h := .allowedRepositoryHosts }}
            - name: CodeFix__AllowedRepositoryHosts__{{ $i }}
              value: {{ $h | quote }}
            {{- end }}
            {{- range $i, $c := .eligibleCategories }}
            - name: CodeFix__EligibleCategories__{{ $i }}
              value: {{ $c | quote }}
            {{- end }}
            - name: CodeFix__ConfidenceFloor
              value: {{ .confidenceFloor | toString | quote }}
            - name: CodeFix__MaxCostUsdPerPlan
              value: {{ .budgets.perPlanUsd | toString | quote }}
            - name: CodeFix__MaxCostUsdPerImplement
              value: {{ .budgets.perImplementUsd | toString | quote }}
            - name: CodeFix__MaxCostUsdPerDay
              value: {{ .budgets.perDayUsd | toString | quote }}
            - name: CodeFix__MaxAttemptsPerRepositoryPerDay
              value: {{ .budgets.attemptsPerRepositoryPerDay | toString | quote }}
            - name: CodeFix__MaxConcurrentJobs
              value: {{ .budgets.concurrentJobs | toString | quote }}
            # .NET TimeSpans, validated by the schema - never Go durations.
            - name: CodeFix__PlanDeadline
              value: {{ .deadlines.plan | quote }}
            - name: CodeFix__ImplementDeadline
              value: {{ .deadlines.implement | quote }}
            - name: CodeFix__ApprovalTimeout
              value: {{ .deadlines.approvalTimeout | quote }}
            - name: CodeFix__JobTtl
              value: {{ .deadlines.jobTtl | quote }}
            - name: CodeFix__PollInterval
              value: {{ .deadlines.pollInterval | quote }}
            - name: CodeFix__WorkspaceSize
              value: {{ .workspaceSize | quote }}
            - name: CodeFix__Resources__CpuRequest
              value: {{ .resources.cpuRequest | toString | quote }}
            - name: CodeFix__Resources__MemoryRequest
              value: {{ .resources.memoryRequest | quote }}
            - name: CodeFix__Resources__CpuLimit
              value: {{ .resources.cpuLimit | toString | quote }}
            - name: CodeFix__Resources__MemoryLimit
              value: {{ .resources.memoryLimit | quote }}
            - name: CodeFix__RequireGreenBuild
              value: {{ .requireGreenBuild | toString | quote }}
            - name: CodeFix__AllowUnauthenticatedApproval
              value: {{ .allowUnauthenticatedApproval | toString | quote }}
            # Empty when the proxy is off, and then the Job sets no proxy variables at all.
            - name: CodeFix__EgressProxyUrl
              value: {{ if .egressProxy.enabled }}{{ include "hephaisto.codeFixProxyUrl" $ | quote }}{{ else }}""{{ end }}
            - name: CodeFix__Sdk
              value: {{ .sdk | quote }}
            - name: CodeFix__Gh
              value: {{ .gh | quote }}
            - name: CodeFix__Model
              value: {{ .model | default "" | quote }}
            - name: CodeFix__NugetCacheClaim
              value: {{ if .nugetCache.enabled }}{{ include "hephaisto.codeFixNugetClaim" $ | quote }}{{ else }}""{{ end }}
            # For the incident link in the PR body: the same externally reachable URL the
            # notifications use. Empty means the PR body carries the incident id without a link.
            - name: CodeFix__ConsoleBaseUrl
              value: {{ $.Values.notifications.baseUrl | quote }}
            # The investigator's read tools must never read the coder namespace. A coder's log is
            # written by a model that just read attacker-influenceable evidence; feeding it back
            # into the NEXT investigation is a reflection path for a prompt injection. The code-fix
            # launcher reads its Jobs through its own client, which this does not restrict.
            - name: Kubernetes__DeniedNamespaces__0
              value: {{ include "hephaisto.codeFixNamespace" $ | quote }}
            {{- end }}
            {{- end }}

            {{- if (.Values.github | default dict).enabled }}
            {{- with .Values.github }}

            # ---------------------------------------------------------------------------
            # GitHub issues as work (v0.14.0). The agent asks; nothing reaches in.
            # ---------------------------------------------------------------------------
            - name: GitHub__Enabled
              value: "true"
            - name: GitHub__ApiBaseUrl
              value: {{ .apiBaseUrl | default "https://api.github.com" | quote }}
            # The agent's own token, from a Secret in THIS namespace. Not secrets.codeFix: that
            # Secret is in the coder namespace, and no rule anywhere lets the agent read it.
            - name: GitHub__Token
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secrets.github }}
                  key: GITHUB_TOKEN
            {{- with .botLogin }}
            - name: GitHub__BotLogin
              value: {{ . | quote }}
            {{- end }}
            - name: GitHub__PollInterval
              value: {{ .pollInterval | default "00:01:00" | quote }}
            # The authorization list. An issue in a repository that is not here is never asked
            # about, however it is assigned.
            {{- range $i, $r := (.issues | default dict).repositories }}
            - name: GitHub__Repositories__{{ $i }}
              value: {{ $r | quote }}
            {{- end }}
            {{- /* int64, not toString: a YAML number is a float to Helm, and an account number
                   of eight digits would otherwise render as 1.2345678e+07. */}}
            {{- range $i, $a := .approvers }}
            - name: GitHub__Approvers__{{ $i }}
              value: {{ int64 $a | quote }}
            {{- end }}
            {{- with include "hephaisto.gitHubProxyUrl" $ }}
            # Through the coder's egress proxy: api.github.com is on its allowlist, and with
            # the agent's egress policy on it is the only way out to GitHub.
            - name: GitHub__ProxyUrl
              value: {{ . | quote }}
            {{- end }}
            {{- with .planner }}
            {{- if .enabled }}
            # The planner (v0.15.0): one project, read on a page load, written by a click.
            - name: GitHub__Planner__Enabled
              value: "true"
            - name: GitHub__Planner__Owner
              value: {{ .owner | quote }}
            - name: GitHub__Planner__Number
              value: {{ int64 .number | quote }}
            - name: GitHub__Planner__StaleAfterDays
              value: {{ int64 (.staleAfterDays | default 5) | quote }}
            {{- range $i, $f := .requiredFields }}
            - name: GitHub__Planner__RequiredFields__{{ $i }}
              value: {{ $f | quote }}
            {{- end }}
            {{- range $i, $a := .assignees }}
            - name: GitHub__Planner__Assignees__{{ $i }}
              value: {{ $a | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- end }}

            {{- with include "hephaisto.investigatorPort" . }}
            {{- with $.Values.investigation.job }}
            # ---------------------------------------------------------------------------
            # Investigation in a Job (v0.12.0 F5). The Job borrows CodeFix__Namespace, the
            # image, the ServiceAccount, the Secret and the egress proxy from the block above.
            # ---------------------------------------------------------------------------
            - name: Investigation__Job__Enabled
              value: "true"
            # The env arm of the executor. The switch ConfigMap's investigationExecutor is the
            # other; the most restrictive wins.
            - name: Investigation__Job__Executor
              value: {{ .executor | toString | quote }}
            - name: Investigation__Job__Port
              value: {{ include "hephaisto.investigatorPort" $ | quote }}
            - name: Investigation__Job__EndpointUrl
              value: {{ printf "http://%s.%s.svc:%s/investigate" (include "hephaisto.fullname" $) $.Release.Namespace (include "hephaisto.investigatorPort" $) | quote }}
            - name: Investigation__Job__Model
              value: {{ .model | quote }}
            - name: Investigation__Job__Sdk
              value: {{ .sdk | quote }}
            - name: Investigation__Job__MaxCostUsd
              value: {{ .maxCostUsd | quote }}
            - name: Investigation__Job__MaxTurns
              value: {{ .maxTurns | quote }}
            - name: Investigation__Job__Deadline
              value: {{ .deadline | quote }}
            - name: Investigation__Job__MaxConcurrentJobs
              value: {{ .concurrentJobs | quote }}
            - name: Investigation__Job__MaxJobsPerHour
              value: {{ .jobsPerHour | quote }}
            - name: Investigation__Job__Overflow
              value: {{ .overflow | default "inprocess" | quote }}
            - name: Investigation__Job__FallbackToInProcess
              value: {{ .fallbackToInProcess | quote }}
            - name: Investigation__Job__Source__Enabled
              value: {{ .source.enabled | quote }}
            {{- end }}
            {{- end }}

            # A DIRECTORY, not a file: each ConfigMap key projects as its own file under it.
            # Unset outside Kubernetes, which makes the ConfigMap arm silent rather than
            # unreadable - someone running `dotnet run` has no ConfigMap and must not be
            # pinned to Observe by its absence. Set-but-missing files ARE unreadable, and do
            # pin to Observe.
            - name: HEPHAISTO_SWITCHES_DIR
              value: /etc/hephaisto

            - name: ASPNETCORE_URLS
              value: "http://0.0.0.0:8080{{ if .Values.webhookPort }};http://0.0.0.0:{{ .Values.webhookPort }}{{ end }}{{ with include "hephaisto.teamsActionsPort" . }};http://0.0.0.0:{{ . }}{{ end }}{{ with include "hephaisto.mcpPort" . }};http://0.0.0.0:{{ . }}{{ end }}{{ with include "hephaisto.investigatorPort" . }};http://0.0.0.0:{{ . }}{{ end }}"

            {{- if .Values.auth.enabled }}
            # ---------------------------------------------------------------------------
            # OIDC. Fails closed: no IdP, no console.
            # ---------------------------------------------------------------------------
            - name: Auth__Enabled
              value: "true"
            - name: Auth__Authority
              value: {{ required "auth.authority is required when auth.enabled is true: there is nothing to authenticate against." .Values.auth.authority | quote }}
            - name: Auth__ClientId
              value: {{ .Values.auth.clientId | quote }}
            - name: Auth__RolesClaim
              value: {{ .Values.auth.rolesClaim | quote }}
            {{- with .Values.auth.readerRole }}
            - name: Auth__ReaderRole
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.auth.approverRole }}
            - name: Auth__ApproverRole
              value: {{ . | quote }}
            {{- end }}
            - name: Auth__ClientSecret
              valueFrom:
                secretKeyRef:
                  name: {{ required "secrets.auth is required when auth.enabled is true. The chart never creates a Secret, it only references one." .Values.secrets.auth }}
                  key: clientSecret
                  # Optional: a PUBLIC client has no secret, and Keycloak's default for a
                  # browser-facing client is public + PKCE, which this agent uses. Requiring one
                  # would make the common configuration impossible.
                  optional: true
            {{- end }}

            {{- with .Values.secrets.webhookToken }}
            # The bearer token /webhooks requires (#138). A secretKeyRef and never a value, for the
            # reason every credential in this chart is one.
            - name: Web__WebhookToken
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: token
            {{- end }}

            {{- with include "hephaisto.mcpPort" . }}
            # ---------------------------------------------------------------------------
            # The MCP endpoint (#157). Each token's value by secretKeyRef, under its name.
            # ---------------------------------------------------------------------------
            - name: Mcp__Enabled
              value: "true"
            - name: Mcp__Port
              value: {{ . | quote }}
            - name: Mcp__AcceptIdentityProviderTokens
              value: {{ $.Values.mcp.acceptIdentityProviderTokens | toString | quote }}
            {{- with $.Values.mcp.maxResponseChars }}
            - name: Mcp__MaxResponseChars
              value: {{ . | quote }}
            {{- end }}
            {{- with $.Values.mcp.requestsPerMinutePerToken }}
            - name: Mcp__RequestsPerMinutePerToken
              value: {{ . | quote }}
            {{- end }}
            {{- range $i, $t := $.Values.mcp.tokens }}
            - name: Mcp__Tokens__{{ $i }}__Name
              value: {{ $t.name | quote }}
            - name: Mcp__Tokens__{{ $i }}__Role
              value: {{ $t.role | default "reader" | quote }}
            - name: Mcp__Tokens__{{ $i }}__Kind
              value: {{ $t.kind | default "shared" | quote }}
            {{- with $t.subject }}
            - name: Mcp__Tokens__{{ $i }}__Subject
              value: {{ . | quote }}
            {{- end }}
            - name: Mcp__Tokens__{{ $i }}__MayWrite
              value: {{ (ne $t.mayWrite false) | toString | quote }}
            - name: Mcp__Tokens__{{ $i }}__Value
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secrets.mcp }}
                  key: {{ $t.name }}
            {{- end }}
            {{- end }}

            {{- if .Values.webhookPort }}
            # Routing, not binding. Kestrel listens on both addresses above; these tell the app
            # which endpoints answer on which - /webhooks only on the webhook port, and the
            # console and API only on the main one. Both halves matter: without the second, the
            # API would still answer on the port the NetworkPolicy is guarding.
            - name: Web__WebhookPort
              value: {{ .Values.webhookPort | quote }}
            - name: Web__MainPort
              value: "8080"
            {{- end }}
            - name: DOTNET_gcServer
              value: "1"

            # ---------------------------------------------------------------------------
            # Escape hatch - LAST, so it can override anything above
            # ---------------------------------------------------------------------------
            # The agent binds far more configuration than this chart exposes as values:
            # Llm:Budget:*, Llm:Investigation:*, Llm:Model, Kubernetes:*, all of it settable
            # as `Section__Key` env vars. Surfacing each one as a first-class value would be
            # a second, worse copy of the options classes that drifts the first time one is
            # renamed. This is the seam instead.
            #
            # Position matters: Kubernetes takes the LAST value for a duplicated env name, so
            # appending here means an operator can override a chart-set variable. That is the
            # point, and it is also why negative-tests.sh asserts you cannot quietly displace
            # GEMINI_API_KEY or LLM_API_KEY with a literal - a plaintext key in
            # `helm get values` forever is exactly what `secrets.llm` exists to prevent.
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}

          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          volumeMounts:
            - name: switches
              mountPath: /etc/hephaisto
              readOnly: true
            # The published image writes nothing to its own filesystem, but .NET still wants
            # somewhere for temp files, so a read-only root needs this.
            - name: tmp
              mountPath: /tmp

          # -------------------------------------------------------------------------------
          # Probes, on two DIFFERENT endpoints
          # -------------------------------------------------------------------------------
          # /healthz answers "is this process alive"; it must NOT check Postgres. /readyz
          # answers "can this instance do useful work" and DOES.
          #
          # Conflating them is the classic self-inflicted outage: if liveness checked
          # Postgres, a slow database would make the kubelet kill the agent, the new pod would
          # find the same slow database, and the agent would CrashLoopBackOff because of a
          # dependency it was supposed to be diagnosing. Liveness restarts; readiness only
          # removes from the Service. Only the second is a safe response to a dependency.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            # Covers EF Core migrations on first boot, which can outlast the liveness probe's
            # patience. Without this, a cold start with pending migrations is killed halfway
            # through and restarted forever.
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 30

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          securityContext:
            allowPrivilegeEscalation: false
            # Defaults TRUE. A development image whose entrypoint is a compiler is the only
            # thing that needs it off - see the comment in values.yaml.
            readOnlyRootFilesystem: {{ .Values.securityContext.readOnlyRootFilesystem }}
            capabilities:
              drop: ["ALL"]

      volumes:
        - name: switches
          configMap:
            name: {{ include "hephaisto.fullname" . }}-switches
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
