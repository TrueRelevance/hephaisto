# The Teams bot against the stand-in, layered over values-dev.yaml when tilt_config.json says
# "teams-bot": "stand-in".
#
# Every id here is made up. The stand-in (infra/e2e/teams-stand-in.yaml) checks the SHAPE of
# what it is sent and not the identity behind it, which is the point: this exercises the
# agent's half - one board, edited in place, alerts by personal chat, nothing deleted -
# without a tenant and without a test editing a channel real people read.
#
# Where the bot's two addresses point is NOT in this file. They have no chart value on
# purpose, so the Tiltfile appends them to extraEnv by position, after whatever is already
# there.
notifications:
  # Overwritten by the Tiltfile with the address this machine's port-forwards bind to.
  baseUrl: http://set-by-the-tiltfile:8100
  teamsBot:
    enabled: true
    tenantId: 00000000-0000-0000-0000-0000000000d1
    appId: 00000000-0000-0000-0000-0000000000d2
    channelId: "19:dev-stand-in@thread.tacv2"
    teamId: 00000000-0000-0000-0000-0000000000d3
    # One member of the stand-in's team, and one address that is not: a recipient who cannot
    # be reached must not stop the one who can.
    recipients:
      - oncall@example.com
      - stranger@elsewhere.example
    board:
      maxIncidents: 20
    # The buttons that act, against the stand-in's own Bot Framework key document: its
    # POST /teams/click signs a click the way Microsoft would and delivers it to port 8082. Where
    # the key document lives is appended by the Tiltfile, like the bot's other two addresses.
    actions:
      enabled: true
      port: 8082
      # The object id the stand-in gives oncall@example.com (TeamsStandIn.ObjectId: the first 16
      # bytes of the address's SHA-256, as a GUID). A click as "user": "oncall@example.com" may
      # close; one as dev@example.com or lead@example.com, members too, is told it may not.
      approvers:
        - 6bc676d8-34ad-8cef-60ff-07a371204c78
      # Approve and Deny on the card too, so the whole surface can be clicked through here. A
      # click takes "actionId" beside "incidentId".
      approvals:
        enabled: true
  # PlannerReviewFinished: the end of a weekly review run (#312), one message to the recipients
  # above - what planner-review.spec.ts R08 reads off the stand-in. Without the review on (the
  # Tiltfile's "github": "stand-in" with "coder": true) the event never happens.
  routes:
    - channel: teamsBot
      events: [IncidentOpened, IncidentEscalated, ApprovalRequired, VerificationFailed, IncidentResolved,
               CodeFixPlanReady, CodeFixPrOpened, CodeFixFailed, ModeChanged, PlannerReviewFinished]

secrets:
  notificationTeamsBot: hephaisto-notification-teams-bot-stand-in
