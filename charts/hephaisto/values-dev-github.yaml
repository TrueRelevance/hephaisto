# GitHub issues as work against the stand-in, layered over values-dev.yaml when tilt_config.json
# says "github": "stand-in".
#
# The stand-in (infra/e2e/notification-receiver/GitHubStandIn.cs, Service github-stand-in in
# hephaisto-obs) answers GitHub's REST calls with GitHub's field names and holds no account:
# nothing here leaves the cluster. scripts/e2e/issues-local.sh reads GitHub__ApiBaseUrl off the
# Deployment and refuses to run against anything but this.
github:
  enabled: true
  apiBaseUrl: http://github-stand-in.hephaisto-obs:8080/github/api
  # GITHUB_STANDIN_BOT_LOGIN in infra/e2e/teams-stand-in.yaml: the account its controls assign.
  botLogin: hephaisto-bot
  # Fast enough that a suite does not wait on it. The default is GitHub's advice for a poller.
  pollInterval: "00:00:05"
  issues:
    repositories:
      # The one the in-cluster git server holds (infra/coder/git-server), because a plan clones
      # it. The suite's second repository, Flou21/not-listed, is not here on purpose.
      - Flou21/hephaisto-fixture-dotnet
  # `maintainer` in scripts/e2e/lib/issues.sh (ISSUES_APPROVER_ID). `passerby`, 2002, is not.
  approvers:
    - 1001
  # The stand-in is in the cluster, on plain http and port 8080. The coder's proxy tunnels to
  # 443 and forwards to 80, to names on its allowlist: it would refuse this, rightly.
  useEgressProxy: false

  # The planner (v0.15.0), against the board the stand-in seeds: issues of repositories
  # acme/..., which are not listed above, so the poller never asks about them. `stranger` is
  # the one login the stand-in answers 201 for and never assigns - the planner's suite reads the
  # refusal off it. scripts/e2e/ui/tests/planner.spec.ts is how a change to the planner is
  # accepted; `curl http://$H:8110/github/control/project` shows the board's side of it.
  planner:
    enabled: true
    owner: acme
    number: 3
    requiredFields:
      - Priority
      - Area
    staleAfterDays: 5
    assignees:
      - flo
      - stranger
    # A new issue is opened in one of these; the stand-in numbers it after the seeded ones.
    repositories:
      - acme/planning
      - acme/api
      - acme/web
      # The repository issues as work are taken from: the planner's work-item buttons are
      # tried on an issue opened here and handed to Hephaisto.
      - Flou21/hephaisto-fixture-dotnet
    # Asking Claude (triage) is switched on by the Tiltfile when the coder is on: the chart
    # refuses it without codeFix.enabled.

# The issues suite (scripts/e2e/issues-local.sh) hands the agent a dozen issues a run, all in the
# one repository the in-cluster git server holds, and every one of them is an attempt on it.
# values-dev-coder.yaml allows 20 a day, which the incident suites alone come close to; with the
# stand-in on, a day of running both would be refused from the second run on - by the cap, and
# reported as "no plan for the issue". Raised here and nowhere else: this file is layered only
# for the stand-in, after values-dev-coder.yaml, so a dev cluster without it keeps 20.
codeFix:
  budgets:
    attemptsPerRepositoryPerDay: 500

# Since #248 a work item's code fix is announced like an incident's - a plan, a pull request, an
# end without one - and the dev route sends all three to the Teams stand-in. A run of the issues
# suite is about thirty such messages on the one channel, where the chart allows sixty an hour:
# the second run within the hour would be suppressed, and with it every incident's message of
# whatever suite ran beside it. Raised here for the reason the budget above is - and to the
# pager suite's own number: this file is layered after scripts/e2e/values-pager.yaml when both
# are on, and must not lower what that suite set.
notifications:
  maxPerChannelPerHour: 1000

secrets:
  # Applied with the stand-in, and holding the stand-in's own token - which opens nothing but
  # that pod's /github/api. Its own name, so that pointing a dev agent at github.com can never
  # be answered with this one.
  github: hephaisto-github-stand-in
